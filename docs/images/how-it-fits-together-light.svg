<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 440" width="1020" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How Agent Bullpen fits together</title>
<desc id="d">You open the dashboard on the hub. Runners on Linux, macOS and Windows machines ask the hub for work and start the agents. The agents sign in to their AI providers directly.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker></defs>
<rect x="20" y="175" width="120" height="60" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="80.0" y="200.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">You</text><text x="80.0" y="217.5" text-anchor="middle" font-size="13" font-weight="400" fill="#57606a">browser or phone</text><line x1="140" y1="205" x2="252" y2="205" stroke="#0969da" stroke-width="1.8" marker-end="url(#a)"/><text x="196" y="172" text-anchor="middle" font-size="11" fill="#57606a">dashboard</text><text x="196" y="186" text-anchor="middle" font-size="11" fill="#57606a">LAN, VPN or tunnel</text><rect x="230" y="100" width="250" height="210" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 4"/><text x="244" y="122" font-size="12" fill="#57606a">Proxmox container, or any</text><text x="244" y="138" font-size="12" fill="#57606a">Debian or Ubuntu machine</text><rect x="252" y="165" width="206" height="80" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="355.0" y="192.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Agent Bullpen hub</text><text x="355.0" y="209.0" text-anchor="middle" font-size="13" font-weight="400" fill="#57606a">tasks, councils,</text><text x="355.0" y="226.0" text-anchor="middle" font-size="13" font-weight="400" fill="#57606a">memory, MCP relay</text><rect x="560" y="20" width="300" height="170" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 4"/><text x="574" y="42" font-size="12" fill="#57606a">Linux and macOS machines (any number)</text><rect x="580" y="65" width="80" height="60" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="620.0" y="99.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">runner</text><rect x="690" y="60" width="150" height="100" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="765.0" y="88.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Claude Code</text><text x="765.0" y="105.5" text-anchor="middle" font-size="13" font-weight="400" fill="#57606a">(one or more accounts)</text><text x="765.0" y="122.5" text-anchor="middle" font-size="13" font-weight="400" fill="#57606a">Gemini CLI,</text><text x="765.0" y="139.5" text-anchor="middle" font-size="13" font-weight="400" fill="#57606a">other agent CLIs</text><line x1="660" y1="95" x2="690" y2="95" stroke="#0969da" stroke-width="1.8" marker-end="url(#a)"/><rect x="560" y="250" width="300" height="170" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 4"/><text x="574" y="272" font-size="12" fill="#57606a">Windows machines (any number)</text><rect x="580" y="295" width="80" height="60" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="620.0" y="329.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">runner</text><rect x="690" y="290" width="150" height="100" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="765.0" y="318.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Claude Code</text><text x="765.0" y="335.5" text-anchor="middle" font-size="13" font-weight="400" fill="#57606a">(one or more accounts)</text><text x="765.0" y="352.5" text-anchor="middle" font-size="13" font-weight="400" fill="#57606a">Gemini CLI,</text><text x="765.0" y="369.5" text-anchor="middle" font-size="13" font-weight="400" fill="#57606a">other agent CLIs</text><line x1="660" y1="325" x2="690" y2="325" stroke="#0969da" stroke-width="1.8" marker-end="url(#a)"/><line x1="580" y1="105" x2="458" y2="190" stroke="#0969da" stroke-width="1.8" marker-end="url(#a)"/><line x1="580" y1="315" x2="458" y2="225" stroke="#0969da" stroke-width="1.8" marker-end="url(#a)"/><text x="520" y="120" text-anchor="middle" font-size="11" fill="#57606a">asks for work</text><text x="520" y="300" text-anchor="middle" font-size="11" fill="#57606a">asks for work</text><rect x="900" y="185" width="100" height="60" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="950.0" y="219.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">AI providers</text><line x1="840" y1="115" x2="900" y2="200" stroke="#0969da" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#a)"/><line x1="840" y1="340" x2="900" y2="230" stroke="#0969da" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#a)"/><text x="950" y="270" text-anchor="middle" font-size="11" fill="#57606a">agents use their own</text><text x="950" y="284" text-anchor="middle" font-size="11" fill="#57606a">logins</text></svg>
