name: Release

# Pushing a tag vX.Y.Z publishes a GitHub release with two files:
#   agent-bullpen-X.Y.Z.tar.gz   the repository at that tag (git archive), in a folder agent-bullpen-X.Y.Z/
#   SHA256SUMS                   its checksum, which the installers check before they use the download
# The release notes are the [X.Y.Z] section of CHANGELOG.md. See CONTRIBUTING.md, "Releasing".
# Only in rob-paprocki/agent-bullpen itself, and only while it is public, so forks, renamed copies and
# private copies make no releases (set-repo.sh changes this name too).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    if: github.repository == 'rob-paprocki/agent-bullpen'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # to create the release and upload its files; nothing else
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Only a public repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          if [[ "$private" != "false" ]]; then
            # Releases are for installing from the public repository; a private copy makes none.
            echo "::error::This repository is private, so it makes no releases."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check the tag matches every version number
        shell: bash
        run: |
          tag="$TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tags must look like v1.2.3, not $tag"; exit 1; }
          want="${tag#v}"
          file=$(tr -d '[:space:]' < VERSION)
          hub=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' hub/app.py)
          runner=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' runner/runner.py)
          echo "tag $want, VERSION $file, hub/app.py $hub, runner/runner.py $runner"
          for v in "$file" "$hub" "$runner"; do
            [[ "$v" == "$want" ]] || { echo "::error::The versions don't all match the tag $tag"; exit 1; }
          done

      - name: Repository checks for a release
        run: python tests/check_repo.py --tag "$TAG"

      - name: Build agent-bullpen-X.Y.Z.tar.gz and SHA256SUMS
        shell: bash
        run: |
          name="agent-bullpen-${TAG#v}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" HEAD
          (cd dist && sha256sum "$name.tar.gz" > SHA256SUMS && cat SHA256SUMS)
          tar -tzf "dist/$name.tar.gz" | sed -n '1,5p'  # not head: under pipefail, tar would die of SIGPIPE

      - name: Release notes from CHANGELOG.md
        run: python scripts/release/release-notes.py "${TAG#v}" > dist/notes.md

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="agent-bullpen-${TAG#v}"
          gh release create "$TAG" "dist/$name.tar.gz" dist/SHA256SUMS \
            --title "Agent Bullpen ${TAG#v}" --notes-file dist/notes.md --verify-tag
